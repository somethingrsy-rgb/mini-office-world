name: Desktop betta screensaver (Windows)

# 베타 화면 보호기(Betta-Screensaver.scr)를 만들어요. Actions 탭에서 Run workflow를 누르세요.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop-betta-saver
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm run dist
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: .scr 파일 만들기
        shell: pwsh
        run: Copy-Item dist/Betta-Screensaver.exe dist/Betta-Screensaver.scr
      - uses: actions/upload-artifact@v4
        with:
          name: Betta-Screensaver
          path: |
            desktop-betta-saver/dist/Betta-Screensaver.scr
            desktop-betta-saver/dist/Betta-Screensaver.exe
          if-no-files-found: error
