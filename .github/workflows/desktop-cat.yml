name: Desktop cat (Windows)

# 바탕화면 고양이 프로그램(Ruby-Cat.exe)을 만들어요. Actions 탭에서 Run workflow를 누르세요.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop-cat
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm run dist
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: Ruby-Cat
          path: |
            desktop-cat/dist/Ruby-Cat.exe
            desktop-cat/dist/Ruby-Cat-folder.zip
          if-no-files-found: error
