<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><title>루비</title>
<style>
  html, body { margin:0; width:100%; height:100%; overflow:hidden; background:transparent; user-select:none; -webkit-user-select:none; }
  .pair { position:absolute; left:0; top:0; will-change:transform; pointer-events:none; -webkit-user-drag:none; }
  .cat { position:absolute; left:0; top:0; will-change:transform; }
  .cat img { display:block; pointer-events:none; -webkit-user-drag:none; }
  .heart { position:absolute; font-size:22px; pointer-events:none; animation:up 1.4s ease-out forwards; }
  @keyframes up { from { opacity:1; transform:translateY(0) } to { opacity:0; transform:translateY(-70px) } }
  .name { position:absolute; padding:2px 12px; border-radius:14px; background:#fff; border:2px solid #ff86b6; color:#5b4a78; font:800 14px 'Malgun Gothic',sans-serif; pointer-events:none; transform:translateX(-50%); animation:fade 3.2s forwards; }
  @keyframes fade { 0%,80% { opacity:1 } 100% { opacity:0 } }
  .bubble { position:absolute; max-width:260px; padding:6px 14px; border-radius:16px; background:#fff; border:2.5px solid #ff86b6; color:#5b4a78; font:800 15px 'Malgun Gothic',sans-serif; text-align:center; pointer-events:none; transform:translateX(-50%); box-shadow:0 4px 14px rgba(80,40,120,.25); animation:pop .25s ease-out; }
  @keyframes pop { from { opacity:0; transform:translateX(-50%) scale(.8) } to { opacity:1; transform:translateX(-50%) scale(1) } }
  .led { position:absolute; box-sizing:border-box; pointer-events:none; border:6px solid #86ff3a; box-shadow:inset 0 0 34px 10px rgba(134,255,58,.55), 0 0 20px 5px rgba(134,255,58,.9); animation:ledpulse 1.4s ease-in-out infinite alternate; }
  @keyframes ledpulse { from { opacity:.45 } to { opacity:1 } }
  .menu { position:absolute; min-width:116px; padding:6px; border-radius:14px; background:#fff; border:2.5px solid #ff86b6; box-shadow:0 4px 14px rgba(80,40,120,.3); font:800 14px 'Malgun Gothic',sans-serif; color:#5b4a78; }
  .ttag { position:absolute; padding:2px 10px; border-radius:12px; background:#fff; border:2.5px solid #86d64a; color:#3f6b1f; font:800 14px 'Malgun Gothic',sans-serif; font-variant-numeric:tabular-nums; pointer-events:none; transform:translateX(-50%); box-shadow:0 2px 8px rgba(60,120,20,.25); white-space:nowrap; }
  .menu .t { padding:2px 8px 6px; font-size:12px; color:#9a86b8; }
  .menu button { display:block; width:100%; margin:2px 0; padding:6px 10px; border:0; border-radius:9px; background:#fff3f8; color:#5b4a78; font:800 14px 'Malgun Gothic',sans-serif; text-align:left; cursor:pointer; }
  .menu button:hover { background:#ffd6e8; }
</style></head>
<body><script src="dims.js"></script><script src="play.js"></script><script src="renderer.js"></script></body></html>
