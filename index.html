<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#c8a8ee" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="미니 오피스" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" type="image/png" href="./favicon.png" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <title>MINI OFFICE WORLD</title>
    <script>
      // 앱이 뜨기 전에 화면 모드를 정해서 첫 화면이 깜빡이지 않게 해요
      (function () {
        try {
          var cfg = JSON.parse(localStorage.getItem('mow-settings') || '{}') || {}
          var t = cfg.theme
          var dark = t === 'dark' || (t !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches)
          document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light')
          document.documentElement.setAttribute('data-palette', !dark && cfg.palette === 'beige' ? 'beige' : 'pastel')
          if (!dark && cfg.palette === 'beige') document.querySelector('meta[name="theme-color"]').setAttribute('content', '#e9dcc6')
          if (dark) document.querySelector('meta[name="theme-color"]').setAttribute('content', '#0b0f14')
        } catch (e) {}
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
