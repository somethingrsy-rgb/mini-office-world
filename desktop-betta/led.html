<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><title>알림 LED</title>
<style>
  html, body { margin:0; width:100%; height:100%; overflow:hidden; background:transparent; cursor:pointer; }
  #b { position:absolute; inset:0; animation:p 1.4s ease-in-out infinite alternate; }
  #b.timer { animation:none; opacity:1; }   /* 타이머: 깜빡이지 않고 켜져 있어요 */
  @keyframes p { from { opacity:.55 } to { opacity:1 } }
</style></head>
<body><div id="b"></div><script>
  const c = new URLSearchParams(location.search).get('c') || '#7fd8ff'
  const b = document.getElementById('b'); b.style.background = c; b.style.boxShadow = `0 0 10px 2px ${c}`
  if (new URLSearchParams(location.search).get('k') === 'timer') b.className = 'timer'
  document.addEventListener('mousedown', () => window.ledApi && window.ledApi.click())
</script></body></html>
